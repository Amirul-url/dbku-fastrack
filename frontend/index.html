<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ALiS.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <script>
      (function () {
        var root = document.documentElement;
        var fontFace = "24px 'Material Symbols Outlined'";

        function markReady() {
          root.classList.add("material-symbols-ready");
        }

        if (!document.fonts || !document.fonts.load) {
          markReady();
          return;
        }

        function loadIconFont() {
          if (document.fonts.check(fontFace)) {
            markReady();
            return;
          }

          document.fonts.load(fontFace).then(function () {
            if (document.fonts.check(fontFace)) {
              markReady();
            }
          });
        }

        loadIconFont();
        document.fonts.ready.then(loadIconFont);
      })();
    </script>
    <script>
      (function () {
        function protectMaterialSymbols(scope) {
          if (!scope || !scope.querySelectorAll) return;

          var icons = scope.matches && scope.matches(".material-symbols-outlined")
            ? [scope]
            : [];

          icons = icons.concat(
            Array.prototype.slice.call(
              scope.querySelectorAll(".material-symbols-outlined")
            )
          );

          icons.forEach(function (icon) {
            icon.classList.add("notranslate");
            icon.setAttribute("translate", "no");
            icon.setAttribute("aria-hidden", "true");
          });
        }

        function startProtection() {
          protectMaterialSymbols(document);

          var observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
              mutation.addedNodes.forEach(function (node) {
                if (node.nodeType === 1) {
                  protectMaterialSymbols(node);
                }
              });
            });
          });

          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startProtection);
        } else {
          startProtection();
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALiS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
